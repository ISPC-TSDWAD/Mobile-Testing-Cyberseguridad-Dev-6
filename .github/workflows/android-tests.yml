name: Pruebas y APK Android

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar plataforma y herramientas
        run: sdkmanager "platforms;android-34" "build-tools;33.0.1"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Ejecutar tests, cobertura, lint y generar APK
        run: bash gradlew --no-daemon testDebugUnitTest jacocoTestReport lintDebug assembleDebug assembleDebugAndroidTest assembleRelease
      - name: Conservar reportes y APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edutools-reportes-y-apk
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/jacoco/jacocoTestReport/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
