plugins {
    id 'com.android.application'
    id 'jacoco'
}

jacoco {
    toolVersion = '0.8.12'
}

def firmaRelease = new Properties()
def archivoFirma = rootProject.file('keystore.properties')
if (archivoFirma.exists()) {
    archivoFirma.withInputStream { firmaRelease.load(it) }
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    executionData.from(file("$buildDir/jacoco/testDebugUnitTest.exec"))
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(fileTree(dir: "$buildDir/intermediates/javac/debug/classes", excludes: [
            '**/R.class', '**/R$*.class', '**/BuildConfig.class'
    ]))
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

android {
    namespace 'ar.edu.ispc.edutools'
    compileSdk 34

    defaultConfig {
        applicationId "ar.edu.ispc.edutools"
        minSdk 21          // Android 5.0 Lollipop
        targetSdk 34
        versionCode 2
        versionName "0.2.0"

        // Corre los tests de Espresso (app/src/androidTest)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (archivoFirma.exists()) {
            release {
                storeFile rootProject.file(firmaRelease['storeFile'])
                storePassword firmaRelease['storePassword']
                keyAlias firmaRelease['keyAlias']
                keyPassword firmaRelease['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (archivoFirma.exists()) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Red (Sprint 2)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Token cifrado (Issue #26). Pide API 23; la app sigue en minSdk 21 y se resuelve en el manifiesto.
    implementation 'androidx.security:security-crypto:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    // Tests de interfaz (Espresso)
    // Versiones 1.6 / 3.6: las 3.5 se cuelgan en Android 15 y 16
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-accessibility:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
